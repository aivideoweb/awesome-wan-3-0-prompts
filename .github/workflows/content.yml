name: Content checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_content.py
      - run: python scripts/build_catalog.py --check
      - run: python scripts/build_showcase.py --check
      - run: git diff --check
